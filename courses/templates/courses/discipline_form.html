{% extends "courses/base.html" %}


{% block title %}

    {{ page_title }}

{% endblock %}


{% block content %}


<div class="card">

    <h1>

        {{ page_title }}

    </h1>


    <form method="post">

        {% csrf_token %}


        {% for field in form %}

            <div class="form-field">

                <label>

                    {{ field.label }}

                </label>


                {{ field }}


                {% for error in field.errors %}

                    <p class="error">

                        {{ error }}

                    </p>

                {% endfor %}

            </div>

        {% endfor %}


        <button
            class="button"
            type="submit"
        >

            {{ button_text }}

        </button>


        <a
            class="button button-secondary"
            href="
            {% url
            'courses:discipline_list'
            %}
            "
        >

            Отмена

        </a>

    </form>

</div>


{% endblock %}
